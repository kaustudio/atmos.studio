<!-- Atmos Gallery wordmark, cropped to its own ink.
     Derived mechanically from atmos-gallery-wordmark-white.svg: the SAME single <path>, with the
     viewBox tightened from "183 0 878 166" to the path's measured bounding box
     (getBBox: x 183.9, y 27, w 876.43, h 135.6) and the orphaned <defs> — the filter and radial
     gradient left behind when the orb was removed from the lockup — dropped, since nothing
     references them. Re-derive both steps on any new brand export.

     Why a tight box: this file is used as a CSS mask for the footer wordmark, which must sit flush
     with the rules above and below it. The untightened viewBox carries 27 units of empty space over
     the ascenders, so a box sized to it would hang the wordmark ~3% of its own width too low and
     make the spacing above and below depend on the viewport rather than on a token.

     The fill is irrelevant: a mask reads alpha only, so this one file serves light and dark. -->
