<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Page not found | Atmos Gallery</title>
<meta name="description" content="That address doesn't exist on Atmos Gallery." />
<!-- No canonical and not in sitemap.xml: this page is an answer to a bad request, not a destination. -->
<meta name="robots" content="noindex" />
<!-- Paints the iOS status bar and Safari toolbar in --surface, so the page fills the window rather
     than sitting between two bars of the OS appearance. Media-scoped, unlike the app's single tag:
     this page has no theme toggle, so both it and the tokens follow the OS query exactly. -->
<meta name="theme-color" content="#f5f5f3" media="(prefers-color-scheme:light)" />
<meta name="theme-color" content="#141413" media="(prefers-color-scheme:dark)" />
<!-- The tokens live in global.css and key their dark values off :root[data-theme], which the app
     sets at mount. This page has no app and no toggle, so it states the reader's own appearance
     itself, once, before first paint. Inline and blocking on purpose: as a stylesheet link this
     would be a second file to fetch before anything is legible, and as a deferred script it would
     paint light and then correct itself in front of the reader. -->
<script>try{if(matchMedia("(prefers-color-scheme: dark)").matches)document.documentElement.setAttribute("data-theme","dark")}catch(e){}</script>
<link rel="icon" type="image/png" sizes="94x94" href="/assets/atmos-gallery-fav.png" />
<link rel="apple-touch-icon" href="/assets/atmos-gallery-fav.png" />
<!-- global.css carries the tokens and the Neue Montreal @font-face rules; it is imported by
     src/notfound/main.js rather than linked, because this page is a Vite entry and the bundler
     should be the one to hash and inline it. notfound.css adds the display 404, the grid and the
     particle layer, and is now the only stylesheet this page links: site-foot.css went with the
     footer, which this page no longer carries. -->
<link rel="stylesheet" href="/notfound.css" />
</head>
<body>

<div class="nf-head">
  <!-- data-logo is the app's own attribute for this wordmark, and it is here for global.css's
       reduced-motion rule, which stops the gradient drift by that attribute — see notfound.css. -->
  <a href="/" aria-label="Atmos Gallery"><span class="nf-mark" data-logo="1" role="img" aria-label="Atmos Gallery"></span></a>
</div>

<main class="nf">
  <!-- The heading is the real type at the real size. src/notfound/main.js rebuilds it as particles
       in place and only then hides it — so with no JS, no WebGL, no Neue Montreal, or a request for
       reduced motion, this is simply a 404 set in Neue Montreal. -->
  <div class="nf-type" data-nf-type>
    <h1 class="nf-title" data-nf-title data-fit-width>404</h1>
  </div>

  <!-- Spoken, never shown. With the explanatory copy gone, a screen reader would otherwise announce
       this page as the bare number "404". It sits OUTSIDE the h1 on purpose: main.js rasterises that
       element's own text, so anything added inside it would be spelled out by the particles. -->
  <p class="nf-said">Page not found. Nothing lives at this address.</p>

  <p class="nf-actions"><a class="nf-cta" href="/">Back to Atmos Gallery</a></p>
</main>

<!-- The shared site footer used to sit here, below the fold. It is gone: this page is one screen and
     one answer — the mark, the 404 and the way back — and the legal links it carried are on every
     page the way back leads to. .nf is still sized to a viewport less the mark's band, so what that
     removal leaves is a page with nothing under the fold rather than a gap. See notfound.css. -->

<!-- The field is a fixed layer over the whole viewport, not a box around the heading: a particle
     pushed off the glyphs has the entire page to travel through and is never clipped by a container.
     It sits outside the content flow because it belongs to no part of it, and is pointer-events:none,
     so the link and the button under it stay live. -->
<canvas class="nf-canvas" data-nf-canvas aria-hidden="true"></canvas>

<!-- A classic script, so it runs during parsing — ahead of the module below, which is deferred, and
     which the build moves into <head> anyway. Order is the tidy case rather than the load-bearing one:
     the fit also re-runs after the webfont lands, and main.js watches the heading for resizes, so the
     cloud follows the type whichever of the two settles last. -->
<script src="/fit-width.js"></script>
<script type="module" src="/src/notfound/main.js"></script>
</body>
</html>
