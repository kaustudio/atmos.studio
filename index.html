<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- The inline cover that used to stand here is gone, and so is page-wipe.js. Both existed only
         because privacy and terms were separate documents: the wipe had to be cut in half and handed
         across an unload/paint boundary through sessionStorage, and the arriving half needed a cover
         painted on the very first frame to hide the browser's own blank page. All three routes are
         served by this one document now, so the swap behind the cover is a setState and the whole
         transition is a single timeline — see src/app/methods/wipe.js navigateTo. -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The title names the category, not the mood. It was "Atmos Gallery" alone — thirteen
         characters, matching only people who already knew the name, which for a new product is
         nobody; then briefly a longer line built around "light and mood", which is the product's
         poetry rather than anything anyone types into a search box. "Image Colour Palette
         Generator" is the query. Brand first, category second, on all four routes, so a search
         result page listing more than one of them reads as one site.

         BRITISH SPELLING, here as everywhere else on the site. An earlier version of this tag
         carried American "Color" on the theory that it is the more common query; that split is
         retired. Google treats the two as synonyms for ranking, so it bought nothing measurable and
         cost a search result that stacked "Color" in the title directly above "colour" in the
         description beneath it.

         The description is keyword-led rather than a restatement of the hero line: what the tool
         does, what it checks, and what it exports — the three things a person scanning results is
         deciding between tools on. The hero line still opens the page itself, which is where it
         belongs.

         MIRRORED IN src/app/routes.js HEAD[APP]. applyHead rewrites this tag at mount on every
         route, the homepage included, so a title that lives only here is overwritten a few hundred
         milliseconds after it arrives — and a rendering crawler indexes what is left. Edit both. -->
    <title>Atmos Gallery | Image Colour Palette Generator</title>
    <meta name="description" content="Atmos Gallery reads a colour palette from an image, checks WCAG contrast for every pair and exports Figma variables, design tokens, CSS, Tailwind and ASE." />
    <link rel="canonical" href="https://atmos.gallery/" />
    <!-- Paints the iOS status bar and Safari toolbar in the page's own --surface, so the site fills
         the window instead of floating between two bars of the OS appearance. Not media-scoped: the
         app forces light at mount regardless of the OS, and src/lib/themeColor.js rewrites this tag
         from the live token when the nav toggle flips the theme. The single hard-coded copy of
         --surface in the codebase, because it has to be correct before any script runs. -->
    <meta name="theme-color" content="#f5f5f3" />
    <!-- Square PNG rather than the lockup SVG: the wordmark is 6.4:1 and rendered into a 16px
         favicon slot it collapsed to an illegible smear. -->
    <link rel="icon" type="image/png" sizes="94x94" href="/assets/atmos-gallery-fav.png" />
    <link rel="apple-touch-icon" href="/assets/atmos-gallery-fav.png" />

    <!-- Social cards. The image is an absolute URL on purpose: several scrapers, Slack's among them,
         will not resolve a relative one. Width and height are declared so a card can be laid out
         before the image finishes downloading, which is what stops the first render of a shared link
         reflowing. twitter:card is summary_large_image rather than summary — with a 1200×630 asset,
         plain summary would crop it into a small square and throw the wordmark away. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Atmos Gallery" />
    <meta property="og:title" content="Atmos Gallery | Image Colour Palette Generator" />
    <meta property="og:description" content="Atmos Gallery reads a colour palette from an image, checks WCAG contrast for every pair and exports Figma variables, design tokens, CSS, Tailwind and ASE." />
    <meta property="og:url" content="https://atmos.gallery/" />
    <meta property="og:image" content="https://atmos.gallery/assets/atmos-gallery-og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Atmos Gallery wordmark, centred in the landing's field of colour." />
    <meta property="og:locale" content="en" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Atmos Gallery | Image Colour Palette Generator" />
    <meta name="twitter:description" content="Atmos Gallery reads a colour palette from an image, checks WCAG contrast for every pair and exports Figma variables, design tokens, CSS, Tailwind and ASE." />
    <meta name="twitter:image" content="https://atmos.gallery/assets/atmos-gallery-og.png" />
    <meta name="twitter:image:alt" content="The Atmos Gallery wordmark, centred in the landing's field of colour." />
    <!-- Structured data. Every field here is checkable against the build: the tool is free, it runs
         in the browser, it is desktop-only, and the image itself is never uploaded — only a ~320 px
         thumbnail, and only when a palette is interpreted. Deliberately absent are
         aggregateRating and review — there are no ratings, and inventing them is both a Google
         structured-data violation and a lie told in a machine-readable format. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Atmos Gallery",
      "url": "https://atmos.gallery/",
      "image": "https://atmos.gallery/assets/atmos-gallery-og.png",
      "description": "Atmos Gallery reads a colour palette from an image, the mood its light and atmosphere carry, not just its dominant colours. It runs in the browser. Your image is read on your own machine and palettes are stored there too.",
      "applicationCategory": "DesignApplication",
      "operatingSystem": "Any modern desktop browser",
      "browserRequirements": "Requires JavaScript. Desktop viewport. Narrow screens show a read-only view.",
      "isAccessibleForFree": true,
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" },
      "publisher": { "@type": "Organization", "name": "KauStudio", "email": "hello@kau.studio" },
      "privacyPolicy": "https://atmos.gallery/privacy",
      "termsOfService": "https://atmos.gallery/terms",
      "featureList": [
        "Extracts a colour palette from an image using OKLab clustering, in the browser",
        "Names and describes the palette's mood from a fixed descriptive vocabulary",
        "WCAG contrast checking across the palette",
        "OKLCH colour harmonies, gamut-mapped to sRGB",
        "Exports Tailwind theme, W3C design tokens, Figma variables, CSS custom properties and .ase",
        "Share links that carry the palette in the URL fragment, with no server lookup"
      ]
    }
    </script>

    <!-- The site footer, shared verbatim with the legal routes and 404. A plain <link> rather than an
         import in global.css: 404.html is the last document served straight out of /public without
         passing through the bundle, and one copy that every entry point reads is the whole point of
         it being a separate file. It only consumes theme tokens, so it follows :root[data-theme]
         wherever it is used without knowing which page it is on. -->
    <link rel="stylesheet" href="/site-foot.css" />

    <!-- Vendored motion runtime (same builds the design was authored against).
         The app code reads window.gsap / window.Observer / window.Flip / window.ScrollToPlugin /
         window.ScrollTrigger / window.Lenis — script order matters.

         /vendor/orb-shader.js used to close this list: the per-orb raw-WebGL renderer for the
         landing's ring formation. The formation is a raymarched volume now (src/app/nebulaField.js,
         loaded on demand with three) and there are no orbs left for it to shade, so it is gone
         rather than left on the wire for every visitor to fetch and never call.

         ScrollTrigger is here rather than loaded with the legal routes on demand, which is the only
         one of these the tool itself never touches. Fetching it at the moment a route swap begins
         would put a network request inside the transition — the precise stall this restructure
         removed — and prefetching it instead only moves the race somewhere harder to see. ~45KB
         served once, cached, and never thought about again is the cheaper trade. -->
    <!-- DEFERRED, NOT SYNCHRONOUS, and the order is still exactly the order above. These six were
         plain <script> tags, which means the parser stopped at each one and did not reach
         <div id="root"> until 176KB of motion runtime had been fetched, parsed and executed. Nothing
         here is needed during parse: every consumer reads window.gsap through a retry (see loader.js
         `arm`, misc.js `_initLenis`), because these were always allowed to arrive late. `defer`
         keeps document order between them and still runs them all before /src/main.tsx, which is a
         module and therefore deferred already — so the load order the app depends on is unchanged
         and the parser is simply no longer held hostage to it.

         fetchpriority="high" IS NOT DECORATION HERE. Chrome queues a deferred script at LOW, and
         measured on this page that put all six behind the images — while the very first thing the
         site does is a gsap timeline, so the whole opening waits on the lowest-priority thing on the
         wire. The hint puts them back where the blocking version had them. Measured both ways over
         five runs: defer alone was worth nothing (FCP and TBT inside noise, on localhost and on
         throttled 4G alike), so it is kept for the render-blocking audit and for correctness, not
         because it made anything faster — and it is only safe to keep BECAUSE of this attribute. -->
    <script defer fetchpriority="high" src="/vendor/gsap.min.js"></script>
    <script defer fetchpriority="high" src="/vendor/Observer.min.js"></script>
    <script defer fetchpriority="high" src="/vendor/Flip.min.js"></script>
    <script defer fetchpriority="high" src="/vendor/ScrollToPlugin.min.js"></script>
    <script defer fetchpriority="high" src="/vendor/ScrollTrigger.min.js"></script>
    <script defer fetchpriority="high" src="/vendor/lenis.min.js"></script>
  </head>
  <body>
    <div id="root"></div>

    <!-- The app is client-rendered, so without JavaScript this document's body is empty — and an
         empty body is exactly what most agent crawlers get, because unlike Googlebot they do not
         execute scripts. This block is the page a reader gets when the script does not run: a real
         description of the tool, and the links that lead out of it.

         It carries inline styles because global.css is imported by main.tsx, so with no JS there is
         no stylesheet either. Kept to type, measure and spacing — no layout that could ever be seen
         alongside the app, since noscript renders only when the app cannot. -->
    <noscript>
      <div style="max-width:34em;margin:0 auto;padding:64px 22px;font-family:system-ui,sans-serif;line-height:1.6;color:#1a1a1a">
        <h1 style="font-size:32px;font-weight:500;line-height:1.1;margin:0 0 20px">Atmos Gallery</h1>
        <p style="margin:0 0 16px"><strong>Colour read from light and atmosphere.</strong> Drop in an image and Atmos Gallery reads a palette from its mood: the light it carries, not only its dominant colours.</p>
        <p style="margin:0 0 16px">It is a free desktop web tool, made by KauStudio. There is nothing to sign up for. The palette is extracted on your own machine: the image is read into a canvas, clustered in OKLCH and discarded, and the full-size image is never uploaded. Only a small thumbnail leaves, and only when you ask for a palette to be named. Palettes are kept in your own browser and can be exported as Tailwind theme values, W3C design tokens, Figma variables, CSS custom properties or an .ase swatch file.</p>
        <p style="margin:0 0 16px">The tool itself needs JavaScript to run, and a desktop-width window. This page is what is left without it. <a href="/about">About</a> does not need it: that page is prerendered in full, and it is where the argument lives — why an image's atmosphere is read rather than its most common pixels, and how a palette becomes a working, accessible colour system.</p>
        <p style="margin:24px 0 0;font-size:14px"><a href="/about">About</a> · <a href="/privacy">Privacy</a> · <a href="/terms">Terms</a> · <a href="/llms.txt">llms.txt</a></p>
      </div>
    </noscript>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
